name: tekartik_firebase_tools
description: Firebase developer tools - the admin sdk flavour of tekartik_firebase_tools_common, and the main dev menu
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  dev_build: ">=1.1.8+2"
  tekartik_firebase_tools_common:
    git:
      url: https://github.com/tekartik/firebase_tools.dart
      path: packages/firebase_tools_common
  # Re-exports tekartik_firebase_firestore, which the public api uses.
  tekartik_firebase_admin_sdk:
    git:
      url: https://github.com/tekartik/firebase_admin_sdk.dart
      path: firebase_admin_sdk

dev_dependencies:
  lints: ">=6.1.0"
  test: ">=1.31.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
  tekartik_firebase_firestore_sembast:
    git:
      url: https://github.com/tekartik/firebase_firestore.dart
      path: firestore_sembast

resolution: workspace
