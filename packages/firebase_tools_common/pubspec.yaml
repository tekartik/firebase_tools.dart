name: tekartik_firebase_tools_common
description: Firebase developer tools - emulator, project deploy and explorer, on the firebase abstractions only
version: 0.1.3
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  cv: ">=1.1.11"
  http: ">=1.5.0"
  meta: ">=1.18.0"
  path: ">=1.9.1"
  process_run: ">=1.2.1+1"
  dev_build: ">=1.1.8+2"
  tekartik_common_build:
    git:
      url: https://github.com/tekartik/app_build.dart
      path: packages/common_build
  tekartik_common_utils:
    git: https://github.com/tekartik/common_utils.dart
  tekartik_firebase:
    git:
      url: https://github.com/tekartik/firebase.dart
      path: firebase
  tekartik_firebase_auth:
    git:
      url: https://github.com/tekartik/firebase_auth.dart
      path: auth
  tekartik_firebase_firestore:
    git:
      url: https://github.com/tekartik/firebase_firestore.dart
      path: firestore
  tekartik_firebase_storage:
    git:
      url: https://github.com/tekartik/firebase_storage.dart
      path: storage

dev_dependencies:
  lints: ">=6.1.0"
  test: ">=1.31.0"
  tekartik_lints:
    git:
      url: https://github.com/tekartik/common.dart
      path: packages/lints
  tekartik_firebase_local:
    git:
      url: https://github.com/tekartik/firebase.dart
      path: firebase_local
  tekartik_firebase_auth_sembast:
    git:
      url: https://github.com/tekartik/firebase_auth.dart
      path: auth_sembast
  tekartik_firebase_firestore_sembast:
    git:
      url: https://github.com/tekartik/firebase_firestore.dart
      path: firestore_sembast
  tekartik_firebase_storage_fs:
    git:
      url: https://github.com/tekartik/firebase_storage.dart
      path: storage_fs

resolution: workspace
